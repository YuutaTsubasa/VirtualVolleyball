[package]
name = "mahjong-volleyball"
version = "0.1.7"
description = "虛擬排球王：虛擬台麻館的角色們來打沙灘排球"
edition = "2021"
rust-version = "1.89"
default-run = "mahjong-volleyball"

[lib]
name = "mahjong_volleyball_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "volleyball-server"
path = "src/bin/volleyball-server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
volleyball-core = { path = "../crates/volleyball-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 區網房間伺服器（Virtual 系列共用）
virtual-lan = { git = "https://github.com/YuutaTsubasa/VirtualCore", branch = "claude/rust-room" }
