[package]
name = "mahjong-volleyball"
version = "0.1.0"
description = "虛擬台麻館沙灘排球：麻將館的角色們來打排球"
edition = "2021"
rust-version = "1.89"
default-run = "mahjong-volleyball"

[lib]
name = "mahjong_volleyball_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "volleyball-server"
path = "src/bin/volleyball-server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
volleyball-core = { path = "../crates/volleyball-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
rand = "0.8"
