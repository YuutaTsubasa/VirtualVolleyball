[package]
name = "volleyball-wasm"
version = "0.1.2"
description = "虛擬台麻館沙灘排球單機版：把比賽引擎包成 WebAssembly，在瀏覽器裡跑"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
volleyball-core = { path = "../volleyball-core" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
